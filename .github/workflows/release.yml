name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin/arm64
            key: darwin-arm64
          - os: macos-15-intel
            platform: darwin/amd64
            key: darwin-amd64
          - os: windows-latest
            platform: windows/amd64
            key: windows-amd64
          - os: ubuntu-latest
            platform: linux/amd64
            key: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build and package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.pushed_at }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node -e "const fs=require('fs');const raw=process.env.INPUT_VERSION||process.env.GITHUB_REF_NAME||'0.0.0';const v=raw.replace(/^v/,'');fs.appendFileSync(process.env.GITHUB_ENV,'VERSION='+v+'\nTAG=v'+v+'\n')"
          node scripts/build-release.mjs
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.key }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute version and checksums
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node -e "const fs=require('fs');const raw=process.env.INPUT_VERSION||process.env.GITHUB_REF_NAME||'0.0.0';const v=raw.replace(/^v/,'');fs.appendFileSync(process.env.GITHUB_OUTPUT,'tag=v'+v+'\n')"
          cd dist
          ls -la
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## NPC 客户端 ${{ steps.version.outputs.tag }}

            ### 安装
            - macOS: 下载 npc-gui_..._darwin_<arch>.app.zip，解压后拖入“应用程序”。
            - Windows: 下载 npc-gui_..._windows_amd64.exe。
            - Linux: 下载 npc-gui_..._linux_amd64.tar.gz，解压后运行 npc-gui。

            ### 自动更新
            已安装的客户端会从本仓库的 GitHub Releases 检查新版本，校验 checksums.txt 与 GitHub asset digest 后替换自身并重启。

            ### 说明
            - 当前构建未做 Apple 公证与 Windows 代码签名，首次打开可能需要系统确认。
            - npc 核心由上游 djylb/nps 单独管理，不包含在此资产中。